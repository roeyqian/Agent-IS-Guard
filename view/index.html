<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopGuard - AI购物守护电商平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="header"></header>
    <main id="main-content">
        <div id="app"></div>
    </main>
    <div id="ai-chat-container" class="ai-float-btn">
        <button id="ai-toggle-btn">🤖💬</button>
    </div>
    <div id="ai-chat-window" class="ai-chat-window hidden">
        <div class="ai-chat-header">
            <div class="ai-tabs">
                <button class="ai-tab active" data-type="seller">🤖 小卖</button>
                <button class="ai-tab" data-type="guardian">🛡️ 小盾</button>
            </div>
            <button id="ai-close-btn">✕</button>
        </div>
        <div class="ai-chat-body" id="ai-messages"></div>
        <div class="ai-chat-footer">
            <input type="text" id="ai-input" placeholder="输入消息...">
            <button id="ai-send-btn">发送</button>
        </div>
    </div>
    <div id="cart-drawer" class="cart-drawer hidden">
        <div class="cart-header">
            <h3>购物车</h3>
            <button id="cart-close-btn">✕</button>
        </div>
        <div class="cart-body" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">合计: ¥<span id="cart-total">0</span></div>
            <button id="cart-checkout-btn" class="btn-primary">去结算</button>
        </div>
    </div>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
